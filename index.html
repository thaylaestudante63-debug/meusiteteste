  <title>Botão de Contato</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-contato {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      padding: 14px 28px;

      background-color: #25D366;
      color: #ffffff;

      text-decoration: none;
      font-size: 16px;
      font-weight: 600;

      border-radius: 8px;

      cursor: pointer;

      transition: all 0.3s ease;
    }

    .btn-contato:hover {
      background-color: #1ebe5d;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
    }

    .btn-contato:active {
      transform: translateY(0);
    }

    .icone-whatsapp {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
